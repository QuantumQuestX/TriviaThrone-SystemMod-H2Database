name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: versioning
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          current_version="$(mvn --batch-mode --no-transfer-progress -q \
            -DforceStdout help:evaluate -Dexpression=project.version)"
          if [[ "$current_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)-SNAPSHOT$ ]]; then
            version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            mvn --batch-mode --no-transfer-progress \
              org.codehaus.mojo:versions-maven-plugin:2.18.0:set \
              -DnewVersion="$version" -DgenerateBackupPoms=false \
              -DprocessDependencies=false -DprocessPlugins=false
          elif [[ "$current_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            version="$current_version"
          else
            echo "Invalid project version: $current_version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Build mod
        run: mvn --batch-mode --no-transfer-progress package -DskipTests

      - name: Commit and tag release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pom.xml
          git commit -m "Release TriviaThrone $VERSION"
          git tag --annotate "$TAG" --message "TriviaThrone $VERSION"
          git push --atomic origin "HEAD:${GITHUB_REF_NAME}" "refs/tags/$TAG"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            "target/triviathrone-infrastructure-${VERSION}-mod.jar" \
            --verify-tag \
            --title "TriviaThrone Infrastructure $VERSION" \
            --generate-notes
